<article class="update-card">
  <div class="update-main">
    <header class="update-byline"><a class="update-date" href="{{ .RelPermalink }}"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time></a></header>
    <div class="update-body prose" id="update-{{ .File.UniqueID }}">{{ .Content }}</div>
    <button class="update-expand" type="button" hidden aria-expanded="false" aria-controls="update-{{ .File.UniqueID }}">{{ if eq .Lang "zh" }}显示更多{{ else }}Show more{{ end }}</button>
    {{ with .Params.external }}<a class="update-link-card" href="{{ . }}" target="_blank" rel="noopener noreferrer"><span class="update-link-host">{{ (urls.Parse .).Host }} ↗</span><strong>{{ $.Params.linkTitle }}</strong><span>{{ $.Params.linkDescription }}</span></a>{{ end }}
    <footer class="update-actions"><button class="update-copy" type="button" hidden data-url="{{ .Permalink }}" aria-label="{{ if eq .Lang "zh" }}分享动态{{ else }}Share update{{ end }}" title="{{ if eq .Lang "zh" }}分享动态{{ else }}Share update{{ end }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V3m-5 5 5-5 5 5M5 14v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg></button><span class="update-feedback" role="status"></span></footer>
  </div>
</article>
