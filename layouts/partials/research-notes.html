{{ $notes := where .Site.RegularPages "Params.researchShowcase" true }}
{{ if $notes }}
<section class="home-section shell-home" aria-labelledby="research-notes-heading">
  <div class="section-heading"><h2 id="research-notes-heading">{{ if eq .Lang "zh" }}研究笔记{{ else }}Research notes{{ end }}</h2></div>
  {{ partial "article-list.html" (dict "pages" $notes.ByDate.Reverse "lang" .Lang "showSection" false "headingLevel" 3) }}
</section>
{{ end }}
