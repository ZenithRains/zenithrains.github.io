publications:
  - id: small-diffusivity
    year: 2026
    title: Small-Diffusivity Concentration for Fractional Aggregation with Cusp Attraction
    authors: Ruiyi Zhang, Xiaoxin Zheng
    question:
      zh: 我想理解弱扩散与尖点吸引的竞争，怎样把尺度平衡变成可以证明的质量集中结论？
      en: I want to understand the competition between weak diffusion and cusp attraction. How can a scale balance lead to a rigorous mass-concentration estimate?
    methods:
      zh: 我和导师郑孝信用帐篷型截断矩联系局部质量，分解非局部跨边界贡献，再结合径向几何与 Lorentz 空间估计。
      en: My advisor, Xiaoxin Zheng, and I use tent moments to track local mass, decompose nonlocal boundary contributions, and combine radial geometry with Lorentz-space estimates.
    result:
      zh: 在径向对称及明确的观测时间、尺度条件下，获得时间积分质量的扩散参数一致正下界。
      en: Under radial symmetry and explicit time and scale conditions, a diffusivity-uniform positive lower bound for time-integrated mass.
    status:
      zh: 已投稿 Mathematical Methods in the Applied Sciences（Wiley），2026年。
      en: Submitted to Mathematical Methods in the Applied Sciences (Wiley), 2026.
    summary:
      zh: 研究尖点吸引下分数阶聚集方程的小扩散质量集中。在径向对称及明确的观测时间、尺度条件下，手稿利用帐篷型截断矩、非局部跨边界分解与 Lorentz 空间估计，得到内禀尺度上时间积分质量的扩散参数一致正下界。
      en: We study small-diffusivity mass concentration for a fractional aggregation equation with cusp attraction. Under radial symmetry and explicit observation-time and scale conditions, the manuscript establishes a diffusivity-uniform positive lower bound for time-integrated mass at the intrinsic scale, using a tent-moment argument, nonlocal boundary decomposition, and Lorentz-space estimates.
  - id: nutrient-taxis
    year: 2026
    title: Time-Uniform Boundedness and Large-Time Behavior for a Planar Doubly Degenerate Nutrient-Taxis System
    authors: Ruiyi Zhang, Xiaoxin Zheng
    question:
      zh: 种群密度和营养浓度趋近零时，扩散都会减弱。我想找到能承受这种双重退化的能量结构，理解全平面上的长期演化。
      en: Diffusion weakens as either population density or nutrient concentration approaches zero. I want to find an energy structure that can handle both degeneracies and help describe long-term evolution on the plane.
    methods:
      zh: 我和导师郑孝信组合化学熵、营养梯度量与质量补偿，用半径一致端点不等式和矩迭代建立控制，再通过紧性方法构造弱解。
      en: My advisor, Xiaoxin Zheng, and I combine chemical entropy, nutrient-gradient quantities, and mass compensation, use radius-uniform endpoint inequalities and moment iteration to obtain estimates, and construct weak solutions through compactness.
    result:
      zh: 在手稿所列初值与加权梯度能量条件下，构造全局有界弱解，并研究正时间正则性、营养衰减和种群长时间收敛。
      en: Under the manuscript's initial-data and weighted gradient-energy assumptions, we construct globally bounded weak solutions and study positive-time regularity, nutrient decay, and long-time population convergence.
    status:
      zh: 手稿打磨中，尚未投稿，2026年。
      en: Manuscript in preparation; not yet submitted, 2026.
    summary:
      zh: 研究二维双退化趋营养系统的全局有界弱解、正时间正则性和长时间行为。当前手稿结合补偿型熵估计、半径一致不等式与内禀矩迭代推进先验估计和弱解构造。
      en: This ongoing work concerns global bounded weak solutions, positive-time regularity, and large-time behavior for a planar doubly degenerate nutrient-taxis system. The current approach combines compensated entropy estimates, radius-uniform inequalities, and an intrinsic moment iteration.
